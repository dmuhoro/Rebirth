<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#f0ce6f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" />
  <!-- Open book / bible shape -->
  <path d="M120 120 L256 256 L120 392 L120 120 Z" fill="#ffffff" opacity="0.95" />
  <path d="M256 120 L392 256 L256 392 L256 120 Z" fill="#ffffff" opacity="0.95" />
  <!-- Cross flame rising from center -->
  <path d="M232 240 L232 120 L280 120 L280 240 L344 240 L344 280 L280 280 L280 400 L232 400 L232 280 L168 280 L168 240 Z" fill="#0c0e12" />
  <!-- Flame glow -->
  <path d="M256 120 Q256 60 280 100 Q300 120 280 160 Q256 200 232 160 Q212 120 232 100 Q256 60 256 120 Z" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
  <!-- Pages lines -->
  <g stroke="#e5c158" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="150" y1="170" x2="210" y2="170" />
    <line x1="150" y1="200" x2="190" y2="200" />
    <line x1="302" y1="170" x2="362" y2="170" />
    <line x1="302" y1="200" x2="342" y2="200" />
    <line x1="150" y1="320" x2="210" y2="320" />
    <line x1="302" y1="320" x2="362" y2="320" />
  </g>
</svg>
